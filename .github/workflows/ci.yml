name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx prisma validate
      - run: npm run lint
      - run: npm test
      - run: npm run build
  forecast:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/forecast } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - run: pytest -q
  marketdata:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/marketdata } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: { go-version: '1.22' }
      - run: go vet ./...
      - run: go test ./...
